# Deploy dir on the VPS: ~/fabrica-web  (source in ./src, runtime secrets in ./.env, never committed)
services:
  web:
    build:
      context: ./src
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: fabrica-web
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:13000:3000"
    mem_limit: 768m
    # whatsapp_bot: lets the admin panel reach Evolution API and the bot worker
    # (EVOLUTION_API_URL=http://fabrica-evolution-api:8080, WHATSAPP_BOT_WORKER_URL=http://fabrica-whatsapp-bot-worker:3001)
    networks:
      - default
      - whatsapp_bot
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/robots.txt >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  whatsapp_bot:
    name: fabrica_whatsapp_bot
    external: true
