# Install: /etc/nginx/sites-available/fabrica-web.conf + symlink in sites-enabled,
# then: sudo certbot --nginx -d todoarcade.com.ar -d www.todoarcade.com.ar
server {
    listen 80;
    server_name todoarcade.com.ar www.todoarcade.com.ar;

    client_max_body_size 6m;   # server actions allow 5mb uploads

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
